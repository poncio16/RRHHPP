# Ejemplo de nginx como proxy inverso de RRHHPP, con HTTPS de Let's Encrypt
# (certbot). Ver docs/operacion.md, "Proxy inverso y HTTPS".
#
# Copiar a /etc/nginx/sites-available/rrhh.conf, reemplazar rrhh.ejemplo.com.ar
# por el dominio real, enlazarlo en sites-enabled y probar con `nginx -t`.
# Los encabezados de seguridad (CSP, HSTS, etc.) los manda la aplicación: no
# repetirlos acá.

# Límite de intentos de inicio de sesión por IP: solo los POST a /login (el
# formulario); las visitas a la página no cuentan. Se suma al bloqueo de
# cuentas que hace la aplicación. Si muchos usuarios entran a la vez desde la
# misma IP pública (una oficina), subir `rate` o `burst`.
map $request_method $rrhh_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $rrhh_login_key zone=rrhh_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rrhh.ejemplo.com.ar;

    # certbot usa esta ruta para renovar el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rrhh.ejemplo.com.ar;

    ssl_certificate     /etc/letsencrypt/live/rrhh.ejemplo.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rrhh.ejemplo.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Igual al límite de la aplicación para adjuntos e importaciones (21 MB):
    # lo que lo supera recibe un 413 claro de nginx.
    client_max_body_size 21m;

    # A nivel server y no en cada location: una location que define su propio
    # proxy_set_header deja de heredar todos estos.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Las páginas llegan por partes (streaming): no acumularlas en nginx.
    proxy_buffering off;
    proxy_read_timeout 120s;

    location = /login {
        limit_req zone=rrhh_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
