# Variante de deploy/nginx/rrhh.conf para un servidor sin IP pública (por
# ejemplo, una PC en la oficina) publicado con Cloudflare Tunnel. Ver
# docs/operacion.md, "Sin IP pública: Cloudflare Tunnel".
#
# Cloudflare pone el certificado HTTPS y `cloudflared`, en este mismo servidor,
# le pasa cada pedido a nginx por 127.0.0.1:8080. nginx no escucha hacia la
# red: solo `cloudflared` llega a él. No hacen falta certbot ni puertos
# abiertos en el router.
#
# Copiar a /etc/nginx/sites-available/rrhh.conf, reemplazar rrhh.ejemplo.com.ar
# por el dominio real, enlazarlo en sites-enabled y probar con `nginx -t`.
# Los encabezados de seguridad (CSP, HSTS, etc.) los manda la aplicación: no
# repetirlos acá.

# Límite de intentos de inicio de sesión por IP, como en rrhh.conf.
map $request_method $rrhh_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $rrhh_login_key zone=rrhh_login:10m rate=10r/m;

server {
    listen 127.0.0.1:8080;
    server_name rrhh.ejemplo.com.ar;

    # La IP real del visitante la informa Cloudflare en CF-Connecting-IP. Se
    # le cree solo a `cloudflared`, que se conecta desde este servidor: así el
    # límite de intentos y la auditoría usan la IP de cada persona.
    set_real_ip_from 127.0.0.1;
    real_ip_header   CF-Connecting-IP;

    # Igual al límite de la aplicación para adjuntos e importaciones (21 MB).
    client_max_body_size 21m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # El visitante entró por HTTPS (a Cloudflare), aunque acá llegue por HTTP.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_buffering off;
    proxy_read_timeout 120s;

    location = /login {
        limit_req zone=rrhh_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
