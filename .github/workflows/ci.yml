name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rrhh
          POSTGRES_PASSWORD: rrhh
          POSTGRES_DB: rrhh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rrhh -d rrhh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rrhh:rrhh@localhost:5432/rrhh?schema=public
      TEST_DATABASE_URL: postgresql://rrhh:rrhh@localhost:5432/rrhh_test?schema=public
      APP_URL: http://localhost:3000
      STORAGE_DIR: ./storage
      LOG_LEVEL: warn
      TRUSTED_PROXY: "false"
      SEED_ADMIN_EMAIL: admin@empresa-demo.com.ar
      SEED_ADMIN_PASSWORD: clave-solo-para-ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Migraciones y seed (dos veces, para verificar que es idempotente)
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npm run db:seed

      - name: El schema coincide con las migraciones
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Crear base de test
        run: PGPASSWORD=rrhh psql -h localhost -U rrhh -d rrhh -c "CREATE DATABASE rrhh_test;"

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npm run test:e2e
        env:
          # El seed obliga a cambiar la contraseña inicial; las pruebas la cambian por esta.
          E2E_NEW_PASSWORD: clave-e2e-ci-2026

      - name: Guardar el reporte de las pruebas de punta a punta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
