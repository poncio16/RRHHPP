name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rrhh
          POSTGRES_PASSWORD: rrhh
          POSTGRES_DB: rrhh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rrhh -d rrhh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rrhh:rrhh@localhost:5432/rrhh?schema=public
      TEST_DATABASE_URL: postgresql://rrhh:rrhh@localhost:5432/rrhh_test?schema=public
      APP_URL: http://localhost:3000
      STORAGE_DIR: ./storage
      LOG_LEVEL: warn
      TRUSTED_PROXY: "false"
      SEED_ADMIN_EMAIL: admin@empresa-demo.com.ar
      SEED_ADMIN_PASSWORD: clave-solo-para-ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La misma versión mayor que la imagen de producción (Dockerfile).
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Migraciones y seed (dos veces, para verificar que es idempotente)
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npm run db:seed

      - name: El schema coincide con las migraciones
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Crear base de test
        run: PGPASSWORD=rrhh psql -h localhost -U rrhh -d rrhh -c "CREATE DATABASE rrhh_test;"

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npm run test:e2e
        env:
          # El seed obliga a cambiar la contraseña inicial; las pruebas la cambian por esta.
          E2E_NEW_PASSWORD: clave-e2e-ci-2026

      - name: Guardar el reporte de las pruebas de punta a punta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # La instalación de producción tal como la describe docs/operacion.md: imágenes,
  # compose, seed base, ingreso por el navegador y backup con prueba de restauración.
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Administrador inicial que crea el seed base; las pruebas lo usan para ingresar.
      E2E_EMAIL: admin@empresa-demo.com.ar
      E2E_PASSWORD: clave-solo-para-ci-1
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Archivo .env de producción para la prueba
        run: |
          cp .env.production.example .env
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^APP_DB_PASSWORD=.*|APP_DB_PASSWORD=$(openssl rand -hex 24)|" \
            -e "s|^APP_URL=.*|APP_URL=http://localhost:3000|" \
            .env

      - name: Construir las imágenes
        run: docker compose build

      - name: Levantar base, migraciones y aplicación
        run: docker compose up -d --wait

      - name: Seed base (dos veces, para verificar que es idempotente)
        run: |
          docker compose run --rm -T -e SEED_ADMIN_EMAIL="$E2E_EMAIL" -e SEED_ADMIN_PASSWORD="$E2E_PASSWORD" migrate npm run db:seed:base
          docker compose run --rm -T migrate npm run db:seed:base

      - name: Estado de la aplicación
        run: curl -fsS http://127.0.0.1:3000/api/health

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Navegador para las pruebas de punta a punta
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Backup y prueba de restauración
        run: |
          scripts/backup.sh
          scripts/restore-test.sh
          # Los que fallan terminan con error y también quedan registrados.
          if scripts/restore-test.sh /no-existe; then exit 1; fi
          if BACKUP_RETENTION_DAYS=x scripts/backup.sh; then exit 1; fi
          cp -r "$(ls -d backups/rrhh-* | tail -n 1)" "$RUNNER_TEMP/roto"
          echo x >>"$RUNNER_TEMP/roto/base.dump"
          if scripts/restore-test.sh "$RUNNER_TEMP/roto"; then exit 1; fi

      - name: Cada backup y cada prueba quedan registrados para el inicio
        run: |
          cat >esperados.txt <<'EOF'
          BACKUP|t|rrhh-*|Tamaño: *.
          PRUEBA_RESTAURACION|t|rrhh-*|* filas, 0 archivos.
          PRUEBA_RESTAURACION|f|no-existe|Error al buscar el backup: no hay uno completo en /no-existe.
          BACKUP|f||Error en BACKUP_RETENTION_DAYS, que tiene que ser un número de días.
          PRUEBA_RESTAURACION|f|roto|Error al verificar las sumas SHA-256.
          EOF
          docker compose exec -T db sh -c \
            'psql -U postgres -d "$APP_DB_NAME" -v ON_ERROR_STOP=1 -At -c "SELECT kind, ok, name, detail FROM backup_run ORDER BY finished_at"' \
            | sed -E -e 's/rrhh-[0-9]{8}T[0-9]{6}Z/rrhh-*/' -e 's/Tamaño: [0-9,]+ [KMG]B/Tamaño: */' -e 's/^(PRUEBA_RESTAURACION\|t\|[^|]*\|)[0-9.]+ filas/\1* filas/' \
            | tee registros.txt
          diff esperados.txt registros.txt

      # Después de los backups, para que el inicio muestre el aviso de la prueba que falló.
      - name: Ingreso, cambio de contraseña y cabeceras contra el contenedor
        run: npx playwright test --grep "sin sesión|no se desbordan"
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_NEW_PASSWORD: clave-e2e-ci-2026

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color
