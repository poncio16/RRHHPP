# SOLO DESARROLLO: PostgreSQL para desarrollo y tests, con usuario y contraseña
# conocidos y el puerto 5432 abierto. La app se ejecuta con `npm run dev`.
# Producción: docker-compose.prod.yml y docs/operacion.md.

# Nombre propio: aunque se ejecute por error en la carpeta de producción, no
# comparte volúmenes con el proyecto "rrhh" de docker-compose.prod.yml.
name: rrhh-desarrollo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rrhh
      POSTGRES_PASSWORD: rrhh
      POSTGRES_DB: rrhh
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh -d rrhh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
